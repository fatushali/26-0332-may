<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Lexus</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff5f8;
}

nav{
    background:#ffe9ef;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#d86c9a;
}

.nav-links{
    list-style:none;
    display:flex;
    gap:20px;
}

.nav-links a{
    text-decoration:none;
    color:#333;
}

.container{
    max-width:800px;
    margin:100px auto;
    padding:30px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.1);
}

h1{
    color:#d86c9a;
}
</style>

</head>
<body>

<nav>
    <div class="logo">LEX<span>U</span>S</div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<div class="container">
    <h1>Contact Lexus</h1>

    <p>Email: info@lexus.com</p>
    <p>Phone: +1 (800) 255-3987</p>
    <p>Address: Lexus Headquarters</p>

    <form>
        <input type="text" placeholder="Your Name" required
               style="width:100%;padding:12px;margin:10px 0;">

        <input type="email" placeholder="Your Email" required
               style="width:100%;padding:12px;margin:10px 0;">

        <textarea placeholder="Your Message" rows="5"
                  style="width:100%;padding:12px;margin:10px 0;"></textarea>

        <button type="submit"
                style="padding:12px 25px;background:#d86c9a;color:white;border:none;">
            Send Message
        </button>
    </form>
</div>

</body>
</html>
