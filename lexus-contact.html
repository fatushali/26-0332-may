```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXUS | Contact</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f0f10;
    color:white;
}

/* NAVBAR */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#1a1a1d;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#d86c9a;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.nav-links a:hover{
    color:#d86c9a;
}

/* CONTACT SECTION */

.contact{
    min-height:100vh;
    display:grid;
    grid-template-columns:1fr 1fr;
    margin-top:80px;
}

.left{
    background:#d86c9a;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:60px;
}

.left h1{
    font-size:50px;
    margin-bottom:20px;
}

.left p{
    margin-bottom:10px;
    font-size:18px;
}

.right{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px;
}

form{
    width:100%;
    max-width:500px;
}

input,
textarea{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    border-radius:5px;
    outline:none;
    font-size:16px;
}

textarea{
    height:150px;
    resize:none;
}

button{
    padding:14px 30px;
    background:#d86c9a;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#c25584;
}

/* MOBILE */

@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:15px;
    }

    .contact{
        grid-template-columns:1fr;
    }

    .left{
        text-align:center;
    }

    .left h1{
        font-size:36px;
    }
}

</style>
</head>

<body>

<nav>
    <div class="logo">LEX<span>U</span>S</div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="models.html">Models</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<section class="contact">

    <div class="left">
        <h1>Contact Us</h1>
        <p>Email: info@lexus.com</p>
        <p>Phone: +1 800 255 3987</p>
        <p>Luxury service tailored to your needs.</p>
    </div>

    <div class="right">
        <form action="#" method="post">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

</section>

</body>
</html>
```
