<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXUS | Contact</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0f0f10;
    color:white;
}

/* NAV */
nav{
    display:flex;
    justify-content:space-between;
    padding:20px 50px;
    background:#1a1a1d;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#d86c9a;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:20px;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

/* CONTACT */
.contact{
    display:grid;
    grid-template-columns:1fr 1fr;
    height:80vh;
}

.left{
    background:#d86c9a;
    padding:60px;
}

.right{
    padding:60px;
}

input,textarea{
    width:100%;
    padding:15px;
    margin-bottom:15px;
}

button{
    padding:12px 25px;
    background:#d86c9a;
    color:white;
    border:none;
}
</style>
</head>

<body>

<nav>
    <div class="logo">LEX<span>U</span>S</div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="models.html">Models</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<div class="contact">

    <div class="left">
        <h1>Contact Us</h1>
        <p>Email: info@lexus.com</p>
        <p>Phone: +1 800 255 3987</p>
    </div>

    <div class="right">
        <form>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <textarea placeholder="Message"></textarea>
            <button>Send</button>
        </form>
    </div>

</div>

</body>
</html>
