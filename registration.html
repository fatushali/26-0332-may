```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXUS | Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(135deg,#ffe6f0,#fff7fb,#ffeef6);
overflow:hidden;
}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, #ff7eb355, transparent 40%),
radial-gradient(circle at 80% 30%, #ffd6e855, transparent 50%),
radial-gradient(circle at 40% 80%, #ffb6d555, transparent 55%);
z-index:-1;
}

.register-box{
background:white;
width:420px;
padding:40px;
border-radius:25px;
box-shadow:0 15px 40px rgba(255,105,180,.2);
text-align:center;
}

.logo{
font-size:40px;
font-weight:bold;
margin-bottom:10px;
}

.logo span{
color:#ff4f9a;
}

h2{
color:#ff4f9a;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
}

.input-group input{
width:100%;
padding:14px;
border:2px solid #ffd1e6;
border-radius:12px;
outline:none;
font-size:16px;
}

.input-group input:focus{
border-color:#ff4f9a;
}

.register-btn{
width:100%;
padding:14px;
border:none;
background:linear-gradient(90deg,#ff7eb3,#ff4f9a);
color:white;
font-size:16px;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

.register-btn:hover{
transform:scale(1.03);
}

#message{
margin-top:15px;
font-weight:bold;
}

.login-link{
margin-top:20px;
color:#666;
}

.login-link a{
text-decoration:none;
color:#ff4f9a;
font-weight:bold;
}

</style>
</head>
<body>

<div class="register-box">

<div class="logo">
LEX<span>U</span>S
</div>

<h2>Create Account</h2>

<form onsubmit="return registerUser()">

<div class="input-group">
<input type="text" id="fullname" placeholder="Full Name">
</div>

<div class="input-group">
<input type="email" id="email" placeholder="Email Address">
</div>

<div class="input-group">
<input type="text" id="username" placeholder="Username">
</div>

<div class="input-group">
<input type="password" id="password" placeholder="Password">
</div>

<div class="input-group">
<input type="password" id="confirmPassword" placeholder="Confirm Password">
</div>

<button type="submit" class="register-btn">
Register
</button>

<p id="message"></p>

</form>

<div class="login-link">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script>

function registerUser(){

let fullname =
document.getElementById("fullname").value;

let email =
document.getElementById("email").value;

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

let confirmPassword =
document.getElementById("confirmPassword").value;

let message =
document.getElementById("message");

if(
fullname === "" ||
email === "" ||
username === "" ||
password === "" ||
confirmPassword === ""
){
message.style.color = "red";
message.innerHTML = "Please fill all fields.";
return false;
}

if(password !== confirmPassword){
message.style.color = "red";
message.innerHTML = "Passwords do not match.";
return false;
}

localStorage.setItem("username", username);
localStorage.setItem("password", password);

message.style.color = "green";
message.innerHTML = "Registration Successful!";

setTimeout(function(){
window.location.href = "login.html";
},2000);

return false;
}

</script>

</body>
</html>
```
