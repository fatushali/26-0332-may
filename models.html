<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexus 3D Showroom</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0b0d;
color:white;
overflow:hidden;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#111;
border-bottom:2px solid #d86c9a;
position:fixed;
width:100%;
top:0;
z-index:10;
}

.logo{font-size:24px;font-weight:bold;}
.logo span{color:#d86c9a;}

.nav a{
color:white;
margin-left:15px;
text-decoration:none;
}

/* LAYOUT */
.container{
display:flex;
height:100vh;
padding-top:60px;
}

/* LEFT PANEL */
.panel{
width:30%;
background:#151518;
padding:20px;
overflow:auto;
}

.car{
background:#1a1a1d;
margin-bottom:15px;
padding:10px;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.car:hover{
background:#d86c9a;
}

/* 3D VIEW */
#viewer{
width:70%;
}

/* MODAL */
.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
}

.modal-box{
background:#1a1a1d;
padding:20px;
border-radius:10px;
text-align:center;
}

button{
padding:10px 15px;
margin-top:10px;
background:#d86c9a;
border:none;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<nav>
<div class="logo">LEX<span>US</span></div>
<div class="nav">
<a href="#">Home</a>
<a href="#">Models</a>
<a href="#">Contact</a>
</div>
</nav>

<div class="container">

<!-- LEFT -->
<div class="panel">

<div class="car" onclick="selectCar('LC500')">LC500</div>
<div class="car" onclick="selectCar('GX')">GX SUV</div>
<div class="car" onclick="selectCar('RCF')">RC F</div>

</div>

<!-- RIGHT 3D VIEW -->
<div id="viewer"></div>

</div>

<!-- CHECKOUT MODAL -->
<div class="modal" id="modal">
<div class="modal-box">
<h2 id="carName"></h2>
<p>Price: KSh 12,000,000</p>
<button onclick="buy()">Buy Now</button>
<button onclick="closeModal()">Close</button>
</div>
</div>

<!-- ENGINE SOUND -->
<audio id="sound" src="https://www.soundjay.com/mechanical/sounds/car-engine-1.mp3"></audio>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

let scene = new THREE.Scene();
scene.background = new THREE.Color("#0b0b0d");

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

let renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth*0.7, window.innerHeight);
document.getElementById("viewer").appendChild(renderer.domElement);

// LIGHT
let light = new THREE.AmbientLight(0xffffff, 1);
scene.add(light);

// SIMPLE CAR (placeholder 3D box)
let geometry = new THREE.BoxGeometry(2,1,4);
let material = new THREE.MeshStandardMaterial({color:0xd86c9a});
let car = new THREE.Mesh(geometry, material);
scene.add(car);

camera.position.z = 6;

// ROTATION WITH MOUSE
let isDragging = false;
let prevX = 0;

renderer.domElement.addEventListener("mousedown", (e)=>{
isDragging = true;
});

renderer.domElement.addEventListener("mouseup", ()=>{
isDragging = false;
});

renderer.domElement.addEventListener("mousemove", (e)=>{
if(isDragging){
car.rotation.y += (e.clientX - prevX) * 0.01;
}
prevX = e.clientX;
});

// ANIMATE
function animate(){
requestAnimationFrame(animate);
car.rotation.y += 0.005;
renderer.render(scene,camera);
}
animate();

// CAR SELECT
function selectCar(name){
document.getElementById("carName").innerText = name;
document.getElementById("modal").style.display="flex";
document.getElementById("sound").play();
}

// CLOSE
function closeModal(){
document.getElementById("modal").style.display="none";
}

// BUY
function buy(){
alert("Purchase Successful (Demo Mode)");
}

</script>

</body>
</html>
