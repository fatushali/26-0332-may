<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexus Models - 3D Showroom</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0b0d;
color:white;
overflow:hidden;
}

/* NAVBAR */
nav{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
background:rgba(10,10,12,0.9);
backdrop-filter:blur(10px);
border-bottom:2px solid #d86c9a;
z-index:10;
}

.logo{
font-size:20px;
font-weight:bold;
}

.logo span{color:#d86c9a;}

.nav a{
color:white;
margin-left:15px;
text-decoration:none;
}

/* LAYOUT */
#scene{
width:100%;
height:100vh;
}

/* LEFT PANEL */
.panel{
position:fixed;
top:80px;
left:20px;
width:220px;
background:rgba(20,20,22,0.85);
padding:15px;
border-radius:12px;
backdrop-filter:blur(10px);
}

.car{
background:#1a1a1d;
padding:10px;
margin:8px 0;
border-radius:8px;
cursor:pointer;
text-align:center;
transition:0.3s;
}

.car:hover{
background:#d86c9a;
}

/* BUY BUTTON */
.buy{
position:fixed;
bottom:20px;
right:20px;
padding:12px 18px;
background:#d86c9a;
border:none;
color:white;
border-radius:10px;
cursor:pointer;
}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
}

.modal-box{
background:#1a1a1d;
padding:20px;
border-radius:10px;
text-align:center;
}

button{
margin-top:10px;
padding:10px;
border:none;
background:#d86c9a;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">LEX<span>US</span></div>
<div class="nav">
<a href="index.html">Home</a>
<a href="gallery.html">Gallery</a>
<a href="models.html">Models</a>
</div>
</nav>

<!-- LEFT PANEL -->
<div class="panel">
<div class="car" onclick="loadCar('LC500')">LC500</div>
<div class="car" onclick="loadCar('GX')">GX SUV</div>
<div class="car" onclick="loadCar('RCF')">RC F</div>
</div>

<!-- 3D SCENE -->
<div id="scene"></div>

<!-- BUY BUTTON -->
<button class="buy" onclick="openBuy()">Buy / Details</button>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">
<h2 id="carName">Car</h2>
<p>Price: KSh 12,000,000</p>
<button onclick="buy()">Checkout</button>
<button onclick="closeModal()">Close</button>
</div>
</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* =====================
   SCENE SETUP
===================== */
let scene = new THREE.Scene();
scene.background = new THREE.Color("#0b0b0d");

let camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,2,6);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById("scene").appendChild(renderer.domElement);

/* CONTROLS */
let controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* LIGHTS */
let light1 = new THREE.DirectionalLight(0xffffff, 2);
light1.position.set(5,5,5);
scene.add(light1);

let light2 = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(light2);

/* FLOOR */
let floor = new THREE.Mesh(
new THREE.PlaneGeometry(20,20),
new THREE.MeshStandardMaterial({color:0x111111, metalness:0.5, roughness:0.2})
);

floor.rotation.x = -Math.PI/2;
floor.position.y = -1;
scene.add(floor);

/* CAR */
let car;
let loader = new THREE.GLTFLoader();

/* LOAD CAR */
function loadCar(name){

if(car) scene.remove(car);

/* 🔥 TRY LOAD GLB MODEL */
loader.load(
"car.glb",
function(gltf){
car = gltf.scene;
car.scale.set(1.5,1.5,1.5);
scene.add(car);
},
undefined,
function(){

/* FALLBACK CAR */
car = new THREE.Mesh(
new THREE.BoxGeometry(2,1,4),
new THREE.MeshStandardMaterial({color:0xd86c9a})
);

scene.add(car);
});

document.getElementById("carName").innerText = name;
}

/* FIRST LOAD */
loadCar("LC500");

/* ANIMATION */
function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}
animate();

/* BUY SYSTEM */
function openBuy(){
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function buy(){
alert("Checkout Successful (Demo Mode)");
}

</script>

</body>
</html>
