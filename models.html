<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXUS | Models</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f0f10;
    color:white;
}

/* NAVBAR */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    background:#111;
    border-bottom:3px solid #d86c9a;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#d86c9a;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* HEADER */
.header{
    text-align:center;
    padding:40px 20px;
}

.header h1{
    font-size:50px;
    color:#d86c9a;
}

/* GALLERY */
.models{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    padding:40px;
}

.model-card{
    background:#1a1a1d;
    border-radius:15px;
    overflow:hidden;
    text-align:center;
    cursor:grab;
    position:relative;
}

.model-card:active{
    cursor:grabbing;
}

.model-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    pointer-events:none;
}

.model-card h3{
    color:#d86c9a;
    padding:10px;
}

.price{
    color:white;
    padding-bottom:15px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:#1a1a1d;
    color:#aaa;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div class="logo">LEX<span>U</span>S</div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="models.html">Models</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<!-- HEADER -->
<section class="header">
    <h1>Lexus Models</h1>
</section>

<!-- MODELS -->
<section class="models">

    <div class="model-card">
        <img src="image/pink-Ic500.jpg">
        <h3>Lexus LC500</h3>
        <div class="price">KSh 12,000,000</div>
    </div>

    <div class="model-card">
        <img src="image/black-Ic500.jpg">
        <h3>LC500 Black Edition</h3>
        <div class="price">KSh 13,500,000</div>
    </div>

    <div class="model-card">
        <img src="image/gx-red-f.jpg">
        <h3>Lexus GX</h3>
        <div class="price">KSh 11,000,000</div>
    </div>

</section>

<!-- FOOTER -->
<footer>
    <p>&copy; 2026 Lexus. All Rights Reserved.</p>
</footer>

<!-- ✅ DRAG SCRIPT -->
<script>
let cards = document.querySelectorAll(".model-card");

cards.forEach(card => {
    let isDown = false;
    let offsetX, offsetY;

    card.addEventListener("mousedown", (e) => {
        isDown = true;
        card.style.position = "absolute";
        offsetX = e.clientX - card.offsetLeft;
        offsetY = e.clientY - card.offsetTop;
    });

    document.addEventListener("mousemove", (e) => {
        if (!isDown) return;

        card.style.left = (e.clientX - offsetX) + "px";
        card.style.top = (e.clientY - offsetY) + "px";
    });

    document.addEventListener("mouseup", () => {
        isDown = false;
    });
});
</script>

</body>
</html>
