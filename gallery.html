<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexus Gallery</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0b0b0d;
color:white;
overflow-x:hidden;
}

/* 🎥 BACKGROUND LIGHT EFFECT */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, #d86c9a33, transparent 40%),
radial-gradient(circle at 80% 30%, #ffffff10, transparent 45%),
radial-gradient(circle at 40% 80%, #d86c9a22, transparent 50%);
animation:moveLights 10s infinite alternate;
z-index:-1;
}

@keyframes moveLights{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
border-bottom:2px solid #d86c9a;
position:sticky;
top:0;
}

.logo span{color:#d86c9a;}

nav a{
color:white;
text-decoration:none;
margin-left:15px;
}

/* HEADER */
.header{
text-align:center;
padding:40px 20px;
}

.header h1{
font-size:40px;
color:#d86c9a;
}

.header p{
color:#aaa;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:#1a1a1d;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:0.4s;
box-shadow:0 10px 20px rgba(0,0,0,0.4);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
transition:0.4s;
}

/* ✨ HOVER EFFECT */
.card:hover{
transform:scale(1.05);
box-shadow:0 15px 30px rgba(216,108,154,0.5);
}

.card:hover img{
transform:scale(1.1);
filter:brightness(1.2);
}

.card h3{
padding:10px;
color:#d86c9a;
}

.card p{
padding:0 10px 10px;
color:#aaa;
}

/* FULL SCREEN VIEWER */
.viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:1000;
}

.viewer img{
width:80%;
max-width:600px;
border-radius:10px;
box-shadow:0 20px 50px rgba(0,0,0,0.7);
}

.viewer h2{
margin-top:10px;
color:#d86c9a;
}

button{
margin-top:15px;
padding:10px 15px;
background:#d86c9a;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">LEX<span>US</span></div>
<div>
<a href="models.html">3D Showroom</a>
</div>
</nav>

<!-- HEADER -->
<div class="header">
<h1>Lexus Gallery</h1>
<p>Browse luxury Lexus models</p>
</div>

<!-- GRID -->
<div class="grid">

<div class="card" onclick="openView('LC500','image/pink-Ic500.jpg')">
<img src="image/pink-Ic500.jpg">
<h3>LC500</h3>
<p>Luxury Coupe</p>
</div>

<div class="card" onclick="openView('GX SUV','image/gx-red-f.jpg')">
<img src="image/gx-red-f.jpg">
<h3>GX SUV</h3>
<p>Off-road Luxury</p>
</div>

<div class="card" onclick="openView('RC F','image/red-rc-f.jpg')">
<img src="image/red-rc-f.jpg">
<h3>RC F</h3>
<p>Sport Performance</p>
</div>

<div class="card" onclick="openView('LX 570','image/beig-Ix570.jpg')">
<img src="image/beig-Ix570.jpg">
<h3>LX 570</h3>
<p>Flagship SUV</p>
</div>

</div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
<img id="vimg">
<h2 id="vtitle"></h2>
<button onclick="closeView()">Close</button>
</div>

<script>

function openView(name,img){
document.getElementById("viewer").style.display="flex";
document.getElementById("vimg").src=img;
document.getElementById("vtitle").innerText=name;
}

function closeView(){
document.getElementById("viewer").style.display="none";
}

</script>

</body>
</html>
