<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexus Gallery</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

/* 🌸 BRIGHT FEMININE BACKGROUND */
body{
background:
linear-gradient(135deg, #ffe6f0, #fff7fb, #ffeef6),
url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=2000&q=80");

background-size:cover;
background-position:center;
background-attachment:fixed;

color:#333;
overflow-x:hidden;
}

/* ✨ SOFT GLOW EFFECT */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, #ff7eb3aa, transparent 45%),
radial-gradient(circle at 80% 30%, #ffd6e8aa, transparent 50%),
radial-gradient(circle at 40% 80%, #ffb6d5aa, transparent 55%);
animation:moveLights 10s infinite alternate;
z-index:-1;
}

@keyframes moveLights{
from{transform:scale(1);}
to{transform:scale(1.1);}
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:rgba(255,255,255,0.7);
backdrop-filter:blur(12px);
border-bottom:2px solid #ff7eb3;
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff4f9a;
}

nav a{
color:#444;
text-decoration:none;
margin-left:15px;
font-weight:bold;
}

/* HEADER */
.header{
text-align:center;
padding:40px 20px;
}

.header h1{
font-size:42px;
color:#ff4f9a;
margin-bottom:10px;
}

.header p{
color:#666;
font-size:18px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.8);
backdrop-filter:blur(10px);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:0.4s;
box-shadow:0 10px 25px rgba(255,105,180,0.2);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
transition:0.4s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 15px 35px rgba(255,105,180,0.35);
}

.card:hover img{
transform:scale(1.08);
filter:brightness(1.1);
}

.card h3{
padding:10px;
color:#ff4f9a;
}

.card p{
padding:0 10px 10px;
color:#666;
}

.price{
color:#ff2f88;
font-size:18px;
font-weight:bold;
padding-bottom:15px;
}

/* VIEWER */
.viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,0.95);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:1000;
}

.viewer img{
width:80%;
max-width:650px;
border-radius:12px;
box-shadow:0 20px 50px rgba(255,105,180,0.25);
}

.viewer h2{
margin-top:15px;
color:#ff4f9a;
}

.viewer p{
font-size:22px;
font-weight:bold;
color:#ff2f88;
margin-top:10px;
}

button{
margin-top:20px;
padding:12px 20px;
background:#ff4f9a;
border:none;
color:white;
cursor:pointer;
border-radius:8px;
font-size:16px;
transition:0.3s;
}

button:hover{
background:#ff2f88;
transform:scale(1.05);
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">LEX<span>US</span></div>

<div>
<a href="models.html">3D Showroom</a>
</div>
</nav>

<!-- HEADER -->
<div class="header">
<h1>Lexus Gallery</h1>
<p>Soft Luxury • Feminine Elegance • Modern Performance</p>
</div>

<!-- GALLERY -->
<div class="grid">

<div class="card" onclick="openView('LC500','image/pink-lc500.jpg','KSh 18,500,000')">
<img src="image/pink-lc500.jpg" alt="LC500">
<h3>LC500</h3>
<p>Luxury Coupe</p>
<p class="price">KSh 18,500,000</p>
</div>

<div class="card" onclick="openView('GX SUV','image/gx-red-f.jpg','KSh 14,800,000')">
<img src="image/gx-red-f.jpg" alt="GX SUV">
<h3>GX SUV</h3>
<p>Off-road Luxury</p>
<p class="price">KSh 14,800,000</p>
</div>

<div class="card" onclick="openView('RC F','image/red-rc-f.jpg','KSh 12,900,000')">
<img src="image/red-rc-f.jpg" alt="RC F">
<h3>RC F</h3>
<p>Sport Performance</p>
<p class="price">KSh 12,900,000</p>
</div>

<div class="card" onclick="openView('LX 570','image/beig-lx570.jpg','KSh 22,500,000')">
<img src="image/beig-lx570.jpg" alt="LX570">
<h3>LX 570</h3>
<p>Flagship SUV</p>
<p class="price">KSh 22,500,000</p>
</div>

</div>

<!-- FULL SCREEN VIEWER -->
<div class="viewer" id="viewer">

<img id="vimg">

<h2 id="vtitle"></h2>

<p id="vprice"></p>

<button onclick="closeView()">Close</button>

</div>

<script>

function openView(name,img,price){

document.getElementById("viewer").style.display="flex";

document.getElementById("vimg").src=img;

document.getElementById("vtitle").innerText=name;

document.getElementById("vprice").innerText=price;

}

function closeView(){

document.getElementById("viewer").style.display="none";

}

</script>

</body>
</html>
