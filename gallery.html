<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexus Premium Gallery</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0b0b0d;
color:white;
overflow-x:hidden;
}

/* 🎥 MOVING LIGHT BACKGROUND */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, #d86c9a33, transparent 40%),
radial-gradient(circle at 80% 30%, #ffffff10, transparent 45%),
radial-gradient(circle at 40% 80%, #d86c9a22, transparent 50%);
animation:lights 8s infinite alternate;
z-index:-1;
}

@keyframes lights{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:rgba(17,17,17,0.8);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:1000;
border-bottom:2px solid #d86c9a;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{color:#d86c9a;}

.nav-links{
display:flex;
gap:20px;
list-style:none;
}

.nav-links a{
color:white;
text-decoration:none;
}

/* 🎞 HERO BANNER */
.hero{
height:300px;
position:relative;
overflow:hidden;
}

.hero img{
width:100%;
height:300px;
object-fit:cover;
position:absolute;
opacity:0;
transition:1s;
}

.hero img.active{
opacity:1;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#1a1a1d;
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 10px 25px rgba(216,108,154,0.3);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card h3{
color:#d86c9a;
padding:10px;
}

.card p{
color:#aaa;
padding:0 10px 10px;
}

.btn{
background:#d86c9a;
border:none;
color:white;
padding:8px;
margin:10px;
cursor:pointer;
border-radius:5px;
}

/* FULL SCREEN VIEWER */
.viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:2000;
}

.viewer img{
width:80%;
max-width:700px;
border-radius:10px;
}

.viewer h2{
margin-top:10px;
color:#d86c9a;
}

.viewer button{
margin-top:15px;
padding:10px 15px;
background:#d86c9a;
border:none;
color:white;
cursor:pointer;
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
background:#111;
color:#aaa;
margin-top:20px;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">LEX<span>US</span></div>
<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="models.html">Models</a></li>
<li><a href="gallery.html">Gallery</a></li>
<li><a href="3d.html">3D Showroom</a></li>
</ul>
</nav>

<!-- 🎞 HERO SLIDER -->
<div class="hero">
<img src="image/pink-Ic500.jpg" class="active">
<img src="image/black-Ic500.jpg">
<img src="image/gx-red-f.jpg">
</div>

<!-- GALLERY -->
<section class="gallery">

<div class="card" onclick="openViewer(this)">
<img src="image/pink-Ic500.jpg">
<h3>LC500</h3>
<p>Luxury coupe</p>
<button class="btn">View / Buy</button>
</div>

<div class="card" onclick="openViewer(this)">
<img src="image/black-Ic500.jpg">
<h3>Black Edition</h3>
<p>Premium performance</p>
<button class="btn">View / Buy</button>
</div>

<div class="card" onclick="openViewer(this)">
<img src="image/gx-red-f.jpg">
<h3>Lexus GX</h3>
<p>Luxury SUV</p>
<button class="btn">View / Buy</button>
</div>

</section>

<!-- FULL VIEWER -->
<div class="viewer" id="viewer">
<img id="viewerImg">
<h2 id="viewerTitle"></h2>
<button onclick="buy()">Buy</button>
<button onclick="closeViewer()">Close</button>
</div>

<script>

/* HERO SLIDER */
let heroImages = document.querySelectorAll(".hero img");
let index = 0;

setInterval(()=>{
heroImages[index].classList.remove("active");
index = (index + 1) % heroImages.length;
heroImages[index].classList.add("active");
},3000);

/* FULL VIEWER */
function openViewer(card){
let img = card.querySelector("img").src;
let title = card.querySelector("h3").innerText;

document.getElementById("viewerImg").src = img;
document.getElementById("viewerTitle").innerText = title;

document.getElementById("viewer").style.display="flex";
}

function closeViewer(){
document.getElementById("viewer").style.display="none";
}

function buy(){
alert("Purchase Successful (Demo Mode)");
}

</script>

</body>
</html>
