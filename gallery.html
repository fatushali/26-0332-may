<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexus Premium Gallery</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0b0b0d;
color:white;
overflow-x:hidden;
}

/* 🎥 BACKGROUND LIGHTS */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, #d86c9a33, transparent 40%),
radial-gradient(circle at 80% 30%, #ffffff10, transparent 45%),
radial-gradient(circle at 40% 80%, #d86c9a22, transparent 50%);
animation:lights 8s infinite alternate;
z-index:-1;
}

@keyframes lights{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:rgba(17,17,17,0.85);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:1000;
border-bottom:2px solid #d86c9a;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{color:#d86c9a;}

.nav-links{
display:flex;
gap:20px;
list-style:none;
}

.nav-links a{
color:white;
text-decoration:none;
}

/* HEADER */
.header{
text-align:center;
padding:40px 20px;
}

.header h1{
font-size:42px;
color:#d86c9a;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

/* 🚗 3D CARD */
.card{
background:#1a1a1d;
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:0.2s;
transform-style:preserve-3d;
position:relative;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
pointer-events:none;
}

.card h3{
color:#d86c9a;
padding:10px;
}

.card p{
color:#aaa;
padding:0 10px 10px;
}

/* FULLSCREEN VIEW */
.viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:2000;
}

.viewer img{
width:80%;
max-width:700px;
border-radius:10px;
}

.viewer h2{
color:#d86c9a;
margin-top:10px;
}

.viewer button{
margin-top:15px;
padding:10px 15px;
background:#d86c9a;
border:none;
color:white;
cursor:pointer;
}

/* NAV HOVER */
.nav-links a:hover{
color:#d86c9a;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">LEX<span>US</span></div>

<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#">Models</a></li>
<li><a href="#">Gallery</a></li>
</ul>
</nav>

<!-- HEADER -->
<div class="header">
<h1>Lexus 3D Gallery</h1>
</div>

<!-- GALLERY -->
<section class="gallery">

<div class="card" onclick="openViewer(this)">
<img src="image/pink-Ic500.jpg">
<h3>LC500</h3>
<p>Luxury Coupe</p>
</div>

<div class="card" onclick="openViewer(this)">
<img src="image/black-Ic500.jpg">
<h3>Black Edition</h3>
<p>Performance Build</p>
</div>

<div class="card" onclick="openViewer(this)">
<img src="image/gx-red-f.jpg">
<h3>Lexus GX</h3>
<p>Luxury SUV</p>
</div>

<div class="card" onclick="openViewer(this)">
<img src="image/red-rc-f.jpg">
<h3>RC F</h3>
<p>Sports Coupe</p>
</div>

</section>

<!-- VIEWER -->
<div class="viewer" id="viewer">
<img id="viewerImg">
<h2 id="viewerTitle"></h2>
<button onclick="closeViewer()">Close</button>
</div>

<script>

/* =========================
   🖱 3D HOVER EFFECT
========================= */
const cards = document.querySelectorAll(".card");

cards.forEach(card => {

card.addEventListener("mousemove", (e) => {

let rect = card.getBoundingClientRect();

let x = e.clientX - rect.left;
let y = e.clientY - rect.top;

let centerX = rect.width / 2;
let centerY = rect.height / 2;

let rotateX = (y - centerY) / 15;
let rotateY = (x - centerX) / 15;

card.style.transform = `
perspective(1000px)
rotateX(${-rotateX}deg)
rotateY(${rotateY}deg)
scale(1.05)
`;
});

card.addEventListener("mouseleave", () => {
card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)";
});



function openViewer(card){
document.getElementById("viewer").style.display="flex";
document.getElementById("viewerImg").src = card.querySelector("img").src;
document.getElementById("viewerTitle").innerText = card.querySelector("h3").innerText;
}

function closeViewer(){
document.getElementById("viewer").style.display="none";
}

</script>

</body>
</html>
