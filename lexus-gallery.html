<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXUS — Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fff5f8;
  --card:#ffe9ef;
  --soft:#ffd8e3;
  --accent:#d86c9a;
  --accent-light:#f3a8c8;
  --text:#3f2d33;
  --muted:#6d5860;
  --white:#ffffff;
}

/* RESET */
*,
*::before,
*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Barlow',sans-serif;
  line-height:1.7;
}

/* LINKS */
a{
  text-decoration:none;
  color:inherit;
}

/* CONTAINER */
.container{
  max-width:1280px;
  margin:0 auto;
  padding:0 40px;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 48px;
  background:rgba(255,245,248,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #f3c8d8;
}

.nav-logo{
  font-family:'Cormorant Garamond',serif;
  font-size:1.9rem;
  letter-spacing:.25em;
  color:var(--text);
}

.nav-logo span{
  color:var(--accent);
}

.nav-links{
  display:flex;
  list-style:none;
  gap:40px;
}

.nav-links a{
  font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;
  font-size:.85rem;
  color:var(--muted);
  transition:.3s;
}

.nav-links a:hover,
.nav-links a.active{
  color:var(--accent);
}

/* HEADER */
header{
  padding:160px 0 80px;
  text-align:center;
}

header p{
  max-width:70ch;
  margin:18px auto 0;
  color:var(--muted);
}

h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.5rem,6vw,5rem);
  color:var(--text);
}

/* GALLERY */
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  padding-bottom:100px;
}

.gallery-grid img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #f3c8d8;
  transition:.4s;
  filter:brightness(.95);
}

.gallery-grid img:hover{
  transform:scale(1.03);
  filter:brightness(1.05);
  box-shadow:0 10px 25px rgba(216,108,154,.2);
}

/* SECTION HEADINGS */
.section-label{
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:.3em;
  margin-top:80px;
}

h2{
  font-family:'Cormorant Garamond',serif;
  color:var(--text);
}

.gold{
  color:var(--accent);
}

.divider{
  width:70px;
  height:2px;
  background:var(--accent);
  margin:20px 0;
}

/* VIDEO */
iframe{
  border-radius:12px;
  border:1px solid #f3c8d8;
}

/* FOOTER */
footer{
  background:var(--card);
  border-top:1px solid #f3c8d8;
  padding:60px 0 25px;
}

.footer-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid #f3c8d8;
  padding-top:20px;
  margin-top:40px;
  color:var(--muted);
}

/* MOBILE */
@media(max-width:900px){
  .gallery-grid{
    grid-template-columns:1fr;
  }

  nav{
    padding:18px 24px;
  }

  .nav-links{
    gap:18px;
  }
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">LEX<span>U</span>S</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a class="active" href="lexus-gallery.html">Gallery</a></li>
    <li><a href="lexus-contact.html">Contact</a></li>
  </ul>
</nav>

<!-- HEADER -->
<header class="container">
  <h1>Lexus <span style="color:var(--accent);">Gallery</span></h1>
  <p>A visual collection of Lexus design — now in a soft pink luxury aesthetic.</p>
</header>

<!-- GALLERY -->
<section class="container">
  <div class="gallery-grid">

    <img src="https://i.pinimg.com/736x/26/60/02/266002b8b7a80f250e1f6ecf52d3e7eb.jpg" alt="Lexus LX SUV">

    <img src="https://i.pinimg.com/736x/4b/22/d1/4b22d1214681a3094353e83a8ae3ebeb.jpg" alt="Lexus IS Sedan">

    <img src="https://i.pinimg.com/1200x/58/44/4a/58444a45f566310114e5924b930313d5.jpg" alt="Lexus ES Sedan">

    <img src="https://i.pinimg.com/736x/c6/91/79/c6917905ecf169ec317ed14e67b3f319.jpg" alt="Lexus RX SUV">

    <img src="https://i.pinimg.com/736x/2c/4c/96/2c4c96161a0d6387684b9542034a1471.jpg" alt="Lexus LS Sedan">

    <img src="https://i.pinimg.com/1200x/1a/0d/66/1a0d66301c3b1f24122abbf59e1c0e82.jpg" alt="Lexus NX Hybrid">

  </div>
</section>

<!-- VIDEO -->
<section class="container">

  <div class="section-label">Video Showcase</div>

  <h2>Lexus <span class="gold">Experience</span></h2>

  <div class="divider"></div>

  <div style="display:grid;grid-template-columns:1fr;gap:24px;margin-top:40px;">
    <iframe width="100%" height="420"
      src="https://www.youtube.com/embed/yFOwhSaZCBs"
      title="Lexus Video"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

</section>

<!-- FOOTER -->
<footer>
  <div class="container">
    <div class="footer-bottom">
      <p>© 2026 Lexus — All Rights Reserved.</p>
      <p style="color:var(--accent);">The Pursuit of Perfection</p>
    </div>
  </div>
</footer>

</body>
</html>
