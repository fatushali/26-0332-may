<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXUS | Home</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0f0f10;
color:white;
overflow:hidden;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 50px;
background:#1a1a1d;
position:relative;
z-index:5;
}

.logo{font-size:30px;font-weight:bold;}
.logo span{color:#d86c9a;}

.nav-links{
display:flex;
list-style:none;
gap:25px;
}

.nav-links a{
color:white;
text-decoration:none;
}

/* HERO */
.hero{
height:90vh;
background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero-content h1{
font-size:70px;
}

.hero-content p{
font-size:22px;
margin-top:10px;
}

.btn{
display:inline-block;
margin-top:20px;
padding:14px 35px;
background:#d86c9a;
color:white;
text-decoration:none;
border-radius:5px;
}

/* ABOUT */
.about{
padding:80px 50px;
background:#1a1a1d;
text-align:center;
}

/* INTRO */
#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
overflow:hidden;
}

/* ENERGY BACKGROUND */
#intro::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle,#d86c9a33,transparent 40%),
radial-gradient(circle,#ffffff10,transparent 50%);
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(0.8);}
50%{transform:scale(1.2);}
100%{transform:scale(0.8);}
}

/* FLASH */
#intro::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:white;
opacity:0;
animation:flash 1.2s ease-out 1;
}

@keyframes flash{
0%{opacity:0;}
10%{opacity:1;}
100%{opacity:0;}
}

/* TEXT */
.intro-text{
z-index:2;
text-align:center;
animation:shake 0.6s ease-in-out 1;
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-5px);}
50%{transform:translateX(5px);}
75%{transform:translateX(-3px);}
100%{transform:translateX(0);}
}

.intro-text h1{
font-size:48px;
color:#d86c9a;
letter-spacing:4px;
opacity:0;
animation:fadeIn 1s forwards;
}

.intro-text h2{
font-size:24px;
margin-top:10px;
opacity:0;
color:#fff;
animation:fadeIn 1s forwards;
animation-delay:0.6s;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

/* EXIT */
#intro{
animation:exit 3.5s forwards;
}

@keyframes exit{
0%{opacity:1;}
80%{opacity:1;}
100%{
opacity:0;
visibility:hidden;
}
}

/* MOBILE */
@media(max-width:768px){
.hero-content h1{font-size:40px;}
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <div class="intro-text">
        <h1>LET THE GAME BEGIN</h1>
        <h2>QUE COMIENCE EL JUEGO</h2>
    </div>
</div>

<!-- NAV (FIXED) -->
<nav>
    <div class="logo">LEX<span>U</span>S</div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="models.html">Models</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <h1>Pursuit of Perfection</h1>
        <p>Luxury, innovation, and performance in every drive.</p>
        <a href="models.html" class="btn">Explore Models</a>
    </div>
</section>

<!-- ABOUT -->
<section class="about">
    <h2 style="color:#d86c9a;">About Lexus</h2>
    <p>Luxury automotive excellence since 1989.</p>
</section>

</body>
</html>
