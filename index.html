```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXUS | Home</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    color:white;
}

/* NAVBAR */
nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#1a1a1d;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#d86c9a;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.nav-links a:hover{
    color:#d86c9a;
}

/* HERO SECTION */
.hero{
    height:100vh;
    background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
        url("images/lexus.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero-content h1{
    font-size:70px;
    margin-bottom:15px;
    text-transform:uppercase;
}

.hero-content p{
    font-size:22px;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    padding:14px 35px;
    background:#d86c9a;
    color:white;
    text-decoration:none;
    border-radius:5px;
    transition:0.3s;
}

.btn:hover{
    background:#c25584;
}

/* MOBILE */
@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:15px;
    }

    .hero-content h1{
        font-size:42px;
    }

    .hero-content p{
        font-size:18px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">LEX<span>U</span>S</div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Models</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<section class="hero">
    <div class="hero-content">
        <h1>Pursuit of Perfection</h1>
        <p>Luxury redesigned for the future</p>
        <a href="#" class="btn">Explore Models</a>
    </div>
</section>

</body>
</html>
```
